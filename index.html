<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mart-Billing</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="./style.css">
</head>

<body class="bg-light font-poppins">

    <header class="navbar navbar-light bg-light border-bottom fixed-top w-100 px-1 py-0 py-md-1">
        <div class="container-fluid">
            <div class="row w-100 align-items-center m-0 gy-2 gx-0">

                <div class="col-6 col-md-3 d-flex align-items-center justify-content-start">
                    <a class="navbar-brand m-0" href="">
                        <img src="./Logo.svg" alt="Logo" height="40">
                    </a>
                </div>

                <div class="col-6 col-md-6 d-flex align-items-center justify-content-end justify-content-md-center">
                    <ul class="navbar-nav d-flex flex-row gap-2 gap-md-4"
                        style="font-size: 1rem; padding: 0; margin: 0;">
                        <li class="nav-item"><a class="nav-link active py-1" href="">Home</a></li>
                        <li class="nav-item"><a class="nav-link py-1"
                                href="https://github.com/muhammad-haris-1219?tab=repositories">About</a></li>
                        <li class="nav-item"><a class="nav-link py-1"
                                href="https://www.linkedin.com/in/muhammad-haris1219/">Contact</a></li>
                    </ul>
                </div>

                <div
                    class="col-12 col-md-3 d-flex align-items-center justify-content-between justify-content-md-end gap-2">

                    <search class="d-flex flex-grow-1 flex-md-grow-0">
                        <input class="form-control form-control-sm" type="search" placeholder="Search"
                            aria-label="Search" style="max-width: 150px;">
                    </search>

                    <div class="d-flex align-items-center gap-2">
                        <button class="btn btn-sm custom-btn" id="add-item" type="button" title="Add New Item"
                            aria-label="Add Item" disabled>
                            <i class="fa-solid fa-plus"></i>
                        </button>
                        <button class="btn btn-sm custom-btn" id="register" type="button" title="Register Now"
                            aria-label="Register">
                            <i class="fa-solid fa-registered"></i>
                        </button>
                    </div>



                </div>

            </div>
        </div>
    </header>

    <main id="main" class="container d-flex align-items-center justify-content-center min-vh-100"
        style="max-width: 900px; padding-top: 90px;">

        <form id="container" class="row g-3 p-4 p-md-5 bg-white rounded-4 shadow-lg" style="display: none;">

            <header class="col-12 mb-2">
                <h2 class="fw-bold text-center">Account Registration</h2>
            </header>

            <div class="col-md-6">
                <input type="text" class="form-control form-control-lg" name="Name" id="userName"
                    placeholder="Your Name" aria-label="Your Name">
            </div>
            <div class="col-md-6">
                <input type="email" class="form-control form-control-lg" name="Email" id="userEmail"
                    placeholder="Your Email" aria-label="Your Email">
            </div>
            <div class="col-md-6">
                <input type="number" class="form-control form-control-lg" name="Number" id="userContact"
                    placeholder="Your Contact Number" aria-label="Contact Number">
            </div>
            <div class="col-md-6">
                <input type="text" class="form-control form-control-lg" name="Country" id="userLocation"
                    placeholder="Your City, Country" aria-label="Location">
            </div>
            <div class="col-md-6">
                <input type="password" class="form-control form-control-lg" name="Password" id="userPassword"
                    placeholder="Your Password" aria-label="Password">
            </div>
            <div class="col-md-6">
                <input type="password" class="form-control form-control-lg" name="Admin" id="Admin"
                    placeholder="For Admin" aria-label="Admin Password">
            </div>

            <footer class="row g-3 m-0 p-0">
                <div class="col-md-6">
                    <button type="submit" id="signup" class="btn btn-lg w-100 fw-semibold custom-btn">SignIp</button>
                </div>
                <div class="col-md-6">
                    <button type="button" id="login" class="btn btn-lg w-100 fw-semibold custom-btn">LogIn</button>
                </div>
            </footer>

        </form>




    </main>

    <section id="table-grid" class="d-flex flex-wrap align-items-stretch gap-1 row-gap-4 w-100 px-2"
        style="margin-top:100px;"> </section>

    <footer class="text-secondary py-4 mt-5 w-100"
        style="font-family: 'Poppins', sans-serif; background-color: #1e1b4b; border-top: 3px solid #6a5acd; box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.15);">
        <div class="container-fluid px-0">
            <div class="row align-items-center gy-3 m-0 w-100 px-3 px-md-4">
                <div class="col-12 col-md-4 text-center text-md-start small text-uppercase fw-bold"
                    style="letter-spacing: 1px; color: #a5b4fc; font-size: 0.75rem;">
                    &copy; 2026 SignUP Catalog &middot; <span class="text-white opacity-50 fw-normal">Production
                        Ready</span>
                </div>
                <div class="col-12 col-md-4 text-center">
                    <a href="https://github.com/muhammad-haris-1219?tab=repositories" target="_blank" rel="noopener"
                        class="mx-2 d-inline-flex align-items-center justify-content-center"
                        style="transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1); color: #a5b4fc; width: 40px; height: 40px; border: 1px solid rgba(165, 180, 252, 0.2); border-radius: 12px; background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(8px);"
                        onmouseover="this.style.background='#6a5acd'; this.style.color='#ffffff'; this.style.transform='translateY(-4px)'; this.style.borderColor='transparent'; this.style.boxShadow='0 8px 20px rgba(106, 90, 205, 0.4)';"
                        onmouseout="this.style.background='rgba(255, 255, 255, 0.03)'; this.style.color='#a5b4fc'; this.style.transform='translateY(0)'; this.style.borderColor='rgba(165, 180, 252, 0.2)'; this.style.boxShadow='none';">
                        <i class="fa-brands fa-github" style="font-size: 1.2rem;"></i>
                    </a>
                    <a href="https://www.linkedin.com/in/muhammad-haris1219/" target="_blank" rel="noopener"
                        class="mx-2 d-inline-flex align-items-center justify-content-center"
                        style="transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1); color: #a5b4fc; width: 40px; height: 40px; border: 1px solid rgba(165, 180, 252, 0.2); border-radius: 12px; background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(8px);"
                        onmouseover="this.style.background='#483d8b'; this.style.color='#ffffff'; this.style.transform='translateY(-4px)'; this.style.borderColor='transparent'; this.style.boxShadow='0 8px 20px rgba(72, 61, 139, 0.4)';"
                        onmouseout="this.style.background='rgba(255, 255, 255, 0.03)'; this.style.color='#a5b4fc'; this.style.transform='translateY(0)'; this.style.borderColor='rgba(165, 180, 252, 0.2)'; this.style.boxShadow='none';">
                        <i class="fa-brands fa-linkedin" style="font-size: 1.2rem;"></i>
                    </a>
                </div>
                <div class="col-12 col-md-4 text-center text-md-end small text-uppercase fw-bold"
                    style="letter-spacing: 1px; color: #a5b4fc; font-size: 0.75rem;">
                    Architected with <i class="fa-solid fa-terminal mx-1" style="color: #6a5acd;"></i> &amp; <i
                        class="fa-solid fa-heart text-danger mx-1"></i> by <span
                        style="color: #c7d2fe; text-shadow: 0 2px 10px rgba(199, 210, 254, 0.2);">Haris</span>
                </div>
            </div>
        </div>
    </footer>

    <script defer src="./App.js" ></script>
</body>

</html>
